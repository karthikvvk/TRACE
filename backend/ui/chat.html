<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRACE · Agent Chat</title>
  <meta name="description" content="TRACE agent chat — text-only interface powered by agent.py" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #09090d;
      --surface:       #111118;
      --surface2:      #17171f;
      --surface3:      #1e1e2a;
      --border:        rgba(255,255,255,0.06);
      --border-focus:  rgba(124,92,252,0.5);
      --accent:        #7c5cfc;
      --accent-dim:    rgba(124,92,252,0.15);
      --accent-glow:   rgba(124,92,252,0.25);
      --text:          #e2e2f0;
      --text-muted:    #5a5a72;
      --text-dim:      #8888a8;
      --user-bubble:   #1f1850;
      --agent-bubble:  #131320;
      --tool-bg:       rgba(124,92,252,0.06);
      --tool-border:   rgba(124,92,252,0.22);
      --tool-color:    #9d80ff;
      --done-bg:       rgba(74,222,128,0.06);
      --done-border:   rgba(74,222,128,0.22);
      --done-color:    #4ade80;
      --error:         #ff4d6d;
      --error-bg:      rgba(255,77,109,0.08);
      --success:       #4ade80;
      --radius:        14px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ── Header ── */
    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #7c5cfc, #a78bfa, #60a5fa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
      box-shadow: 0 0 16px rgba(124,92,252,0.35);
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .header-title h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: var(--text);
    }
    .header-title .subtitle {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .header-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    #status-label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    #status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #333;
      transition: background 0.4s, box-shadow 0.4s;
      flex-shrink: 0;
    }
    #status-dot.online  { background: var(--success); box-shadow: 0 0 8px var(--success); }
    #status-dot.offline { background: var(--error); }

    #clear-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 10px;
      font-family: inherit;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
      letter-spacing: 0.02em;
    }
    #clear-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── Model badge ── */
    #model-badge {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.02em;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Empty state */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex: 1;
      color: var(--text-muted);
      text-align: center;
      padding: 40px 20px;
    }
    #empty-state .empty-icon { font-size: 36px; opacity: 0.4; }
    #empty-state p { font-size: 13px; max-width: 280px; }

    /* Message rows */
    .msg-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 82%;
      animation: fadeUp 0.18s ease;
    }
    .msg-row.user { align-self: flex-end; align-items: flex-end; }
    .msg-row.agent { align-self: flex-start; align-items: flex-start; }

    .msg-label {
      font-size: 10px;
      color: var(--text-muted);
      padding: 0 5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 13.5px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
      letter-spacing: 0.01em;
    }
    .msg-row.user .bubble {
      background: var(--user-bubble);
      border: 1px solid rgba(124,92,252,0.18);
      border-bottom-right-radius: 4px;
    }
    .msg-row.agent .bubble {
      background: var(--agent-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg-row.agent.streaming .bubble {
      border-color: var(--accent-glow);
    }

    /* Tool chips */
    .tool-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 82%;
      align-self: flex-start;
    }
    .tool-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      padding: 5px 12px;
      border-radius: 20px;
      background: var(--tool-bg);
      border: 1px solid var(--tool-border);
      color: var(--tool-color);
      width: fit-content;
      animation: fadeUp 0.15s ease;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }
    .tool-chip.done {
      background: var(--done-bg);
      border-color: var(--done-border);
      color: var(--done-color);
    }
    .spinner { animation: spin 1s linear infinite; display: inline-block; }

    /* System / error */
    .system-pill {
      align-self: center;
      font-size: 11px;
      color: var(--text-dim);
      padding: 5px 14px;
      background: var(--surface2);
      border-radius: 20px;
      border: 1px solid var(--border);
      animation: fadeUp 0.15s ease;
    }
    .system-pill.error {
      color: var(--error);
      background: var(--error-bg);
      border-color: rgba(255,77,109,0.25);
    }

    /* Typing indicator */
    #typing-row {
      display: none;
      align-self: flex-start;
      max-width: 82%;
    }
    #typing-row.visible { display: flex; }
    #typing-row .bubble { padding: 12px 16px; }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dots span {
      width: 5px; height: 5px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    /* ── Input area ── */
    #input-area {
      padding: 12px 16px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #input-wrap {
      flex: 1;
      position: relative;
    }

    #chat-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13.5px;
      color: var(--text);
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 160px;
      line-height: 1.55;
      transition: border-color 0.2s, box-shadow 0.2s;
      display: block;
    }
    #chat-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    #chat-input::placeholder { color: var(--text-muted); }
    #chat-input:disabled { opacity: 0.5; cursor: not-allowed; }

    #send-btn {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      color: white;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      flex-shrink: 0;
      box-shadow: 0 2px 12px var(--accent-glow);
    }
    #send-btn:hover:not(:disabled) { opacity: 0.88; box-shadow: 0 4px 18px var(--accent-glow); }
    #send-btn:active:not(:disabled) { transform: scale(0.91); }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: none; }

    /* Input hint */
    #input-hint {
      font-size: 10px;
      color: var(--text-muted);
      padding: 4px 5px 0;
      letter-spacing: 0.02em;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Scrollbar glow on active ── */
    #messages.busy::-webkit-scrollbar-thumb { background: var(--accent-dim); }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div id="header">
    <div class="logo-mark">T</div>
    <div class="header-title">
      <h1>TRACE Agent</h1>
      <span class="subtitle">Powered by agent.py · Gemini</span>
    </div>
    <div id="model-badge">–</div>
    <div class="header-status">
      <span id="status-label">connecting…</span>
      <div id="status-dot"></div>
    </div>
    <button id="clear-btn" title="Clear conversation">Clear</button>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div id="empty-state">
      <div class="empty-icon">⬡</div>
      <p>Ask TRACE anything — I can read your browser tabs, scrape URLs, run searches, and more.</p>
    </div>
  </div>

  <!-- Typing indicator -->
  <div id="typing-row" class="msg-row agent">
    <span class="msg-label">TRACE</span>
    <div class="bubble">
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- Input -->
  <div id="input-area">
    <div id="input-wrap">
      <textarea id="chat-input" rows="1" placeholder="Message TRACE… (Enter to send, Shift+Enter for newline)" autocomplete="off" spellcheck="true"></textarea>
    </div>
    <button id="send-btn" title="Send message" aria-label="Send message">➤</button>
  </div>

</div>

<script>
'use strict';

const API = 'http://127.0.0.1:8000';

// ── DOM refs ──────────────────────────────────────────────────────────────────
const messagesEl   = document.getElementById('messages');
const emptyState   = document.getElementById('empty-state');
const inputEl      = document.getElementById('chat-input');
const sendBtn      = document.getElementById('send-btn');
const typingRow    = document.getElementById('typing-row');
const statusDot    = document.getElementById('status-dot');
const statusLabel  = document.getElementById('status-label');
const modelBadge   = document.getElementById('model-badge');
const clearBtn     = document.getElementById('clear-btn');

let history = [];   // [{role:'user'|'model', content:str}]
let busy    = false;

// ── HTML escape ───────────────────────────────────────────────────────────────
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Scroll ────────────────────────────────────────────────────────────────────
function scrollEnd() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ── Status polling ────────────────────────────────────────────────────────────
async function pollStatus() {
  try {
    const r = await fetch(`${API}/chat/status`, { signal: AbortSignal.timeout(3000) });
    if (!r.ok) throw new Error('not ok');
    const d = await r.json();
    statusDot.className   = 'online';
    statusLabel.textContent = d.browser_connected ? 'extension connected' : 'no extension';
    if (d.model) modelBadge.textContent = d.model;
  } catch {
    statusDot.className   = 'offline';
    statusLabel.textContent = 'backend offline';
  }
}
pollStatus();
setInterval(pollStatus, 6000);

// ── DOM helpers ───────────────────────────────────────────────────────────────
function hideEmpty() {
  if (emptyState) emptyState.style.display = 'none';
}

function addUserMsg(text) {
  hideEmpty();
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<span class="msg-label">You</span><div class="bubble">${esc(text)}</div>`;
  messagesEl.appendChild(row);
  scrollEnd();
}

function createAgentBubble() {
  hideEmpty();
  const row = document.createElement('div');
  row.className = 'msg-row agent streaming';
  row.innerHTML = `<span class="msg-label">TRACE</span><div class="bubble"></div>`;
  messagesEl.appendChild(row);
  scrollEnd();
  return row;
}

function addSystemPill(text, isError = false) {
  const el = document.createElement('div');
  el.className = 'system-pill' + (isError ? ' error' : '');
  el.textContent = text;
  messagesEl.appendChild(el);
  scrollEnd();
}

// Tool chip management — keyed by tool name
const activeChips = {};
let toolGroup = null;

function ensureToolGroup() {
  if (!toolGroup) {
    toolGroup = document.createElement('div');
    toolGroup.className = 'tool-group';
    messagesEl.appendChild(toolGroup);
  }
}

function addToolChip(name) {
  ensureToolGroup();
  const chip = document.createElement('div');
  chip.className = 'tool-chip';
  chip.innerHTML = `<span class="spinner">⟳</span> ${esc(name)}`;
  toolGroup.appendChild(chip);
  activeChips[name] = chip;
  scrollEnd();
}

function resolveToolChip(name) {
  const chip = activeChips[name];
  if (chip) {
    chip.className = 'tool-chip done';
    chip.innerHTML = `✓ ${esc(name)}`;
  }
}

function resetToolState() {
  toolGroup = null;
  for (const k in activeChips) delete activeChips[k];
}

// ── Set busy state ─────────────────────────────────────────────────────────────
function setBusy(val) {
  busy = val;
  sendBtn.disabled = val;
  inputEl.disabled = val;
  messagesEl.classList.toggle('busy', val);
}

// ── Send ──────────────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || busy) return;

  setBusy(true);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  addUserMsg(text);
  history.push({ role: 'user', content: text });

  // Show typing & move to bottom
  typingRow.classList.add('visible');
  messagesEl.appendChild(typingRow);
  scrollEnd();

  let agentRow  = null;
  let agentText = '';
  resetToolState();

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
    });

    typingRow.classList.remove('visible');

    if (!res.ok) {
      addSystemPill(`HTTP ${res.status} — ${res.statusText}`, true);
      setBusy(false);
      return;
    }

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop() ?? '';

      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        const raw = line.slice(5).trim();
        if (!raw) continue;
        let ev;
        try { ev = JSON.parse(raw); } catch { continue; }

        switch (ev.type) {
          case 'text':
            if (!agentRow) agentRow = createAgentBubble();
            agentText += ev.content;
            agentRow.querySelector('.bubble').textContent = agentText;
            scrollEnd();
            break;

          case 'tool_call':
            addToolChip(ev.name);
            break;

          case 'tool_result':
            resolveToolChip(ev.name);
            break;

          case 'error':
            typingRow.classList.remove('visible');
            addSystemPill(ev.content, true);
            break;

          case 'done':
            if (agentText) history.push({ role: 'model', content: agentText });
            if (agentRow) agentRow.classList.remove('streaming');
            break;
        }
      }
    }

  } catch (err) {
    typingRow.classList.remove('visible');
    addSystemPill('Network error: ' + err.message, true);
  }

  setBusy(false);
  inputEl.focus();
}

// ── Clear ─────────────────────────────────────────────────────────────────────
clearBtn.addEventListener('click', () => {
  history = [];
  messagesEl.innerHTML = '';
  if (emptyState) {
    emptyState.style.display = '';
    messagesEl.appendChild(emptyState);
  }
  resetToolState();
  inputEl.focus();
});

// ── Events ────────────────────────────────────────────────────────────────────
sendBtn.addEventListener('click', sendMessage);

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Auto-grow textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

// Focus input on load
inputEl.focus();
</script>
</body>
</html>
